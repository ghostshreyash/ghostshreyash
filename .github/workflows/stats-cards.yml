name: generate stats cards

on:
  schedule:
    - cron: "30 0 * * *"

  workflow_dispatch:

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: generate stats card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=ghostshreyash&show_icons=true&include_all_commits=true&count_private=true&theme=tokyonight&hide_border=true
          path: profile/stats.svg
          token: ${{ secrets.SUMMARY_GITHUB_TOKEN }}

      - name: generate top languages card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: username=ghostshreyash&layout=compact&langs_count=6&count_private=true&theme=tokyonight&hide_border=true&exclude_repo=create-better-t-stack,plugins-workspace
          path: profile/top-langs.svg
          token: ${{ secrets.SUMMARY_GITHUB_TOKEN }}

      # no action exists for the streak card, so fetch it and keep the last good
      # copy if the service is down
      - name: fetch streak card
        run: |
          mkdir -p profile
          url="https://streak-stats.demolab.com/?user=ghostshreyash&theme=tokyonight&hide_border=true&mode=weekly"
          if curl -fsS --max-time 60 "$url" -o streak.tmp.svg \
            && [ "$(wc -c < streak.tmp.svg)" -gt 1000 ] \
            && head -c 400 streak.tmp.svg | grep -q "<svg"; then
            mv streak.tmp.svg profile/streak.svg
          else
            echo "::warning::streak card unavailable, keeping the previous one"
            rm -f streak.tmp.svg
          fi

      - name: commit cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/*.svg
          git diff --quiet --cached || git commit -m "chore: refresh stats cards"
          git push
